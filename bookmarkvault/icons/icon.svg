<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#1a1a2e"/>

  <!-- Bookmark ribbon shape -->
  <polygon points="36,22 92,22 92,106 64,86 36,106" fill="#e8a020" rx="4"/>

  <!-- Vault dial ring -->
  <circle cx="64" cy="60" r="22" fill="#1a1a2e" stroke="#e8a020" stroke-width="4"/>
  <circle cx="64" cy="60" r="14" fill="none" stroke="#c47a10" stroke-width="3"/>

  <!-- Dial notches -->
  <line x1="64" y1="38" x2="64" y2="44" stroke="#e8a020" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="76" x2="64" y2="82" stroke="#e8a020" stroke-width="3" stroke-linecap="round"/>
  <line x1="42" y1="60" x2="48" y2="60" stroke="#e8a020" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="60" x2="86" y2="60" stroke="#e8a020" stroke-width="3" stroke-linecap="round"/>

  <!-- Dial pointer -->
  <line x1="64" y1="60" x2="74" y2="48" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="64" cy="60" r="3" fill="#ffffff"/>
</svg>
