<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TabVault — Tab View</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap');

    :root {
      /* Defaults — overridden immediately by themes.js */
      --bg: #080a0f;
      --surface: #0e1118;
      --surface2: #141a24;
      --surface3: #1c2333;
      --border: #1f2a3d;
      --border2: #2a3a54;
      --accent: #4f7eff;
      --accent2: #a78bfa;
      --green: #2dd4a7;
      --yellow: #fbbf24;
      --red: #f87171;
      --text: #dde4f0;
      --text2: #8899bb;
      --grid-color: rgba(79,126,255,0.04);
      --topbar-bg: rgba(8,10,15,0.92);
      --mono: 'JetBrains Mono', monospace;
      --title: 'Syne', sans-serif;

      /* Chrome tab group colours — fixed regardless of theme */
      --group-blue: #3b82f6;
      --group-red: #ef4444;
      --group-yellow: #f59e0b;
      --group-green: #10b981;
      --group-pink: #ec4899;
      --group-purple: #8b5cf6;
      --group-cyan: #06b6d4;
      --group-orange: #f97316;
      --group-grey: #6b7280;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--title);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(79,126,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79,126,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--topbar-bg);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      display: flex;
      align-items: center;
      gap: 24px;
      height: 60px;
    }

    .topbar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-hex {
      font-size: 22px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }

    .logo-name {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .topbar-sep { width: 1px; height: 24px; background: var(--border); }

    .topbar-stats {
      display: flex;
      gap: 16px;
      flex: 1;
    }

    .topbar-stat {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text2);
    }

    .topbar-stat b {
      color: var(--accent);
      font-weight: 600;
    }

    .topbar-actions {
      display: flex;
      gap: 8px;
    }

    .topbar-btn {
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--border2);
      background: var(--surface2);
      color: var(--text2);
      font-family: var(--title);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .topbar-btn:hover { background: var(--surface3); color: var(--text); }
    .topbar-btn.primary {
      background: linear-gradient(135deg, var(--accent), #3b5ce0);
      border-color: transparent;
      color: #fff;
    }
    .topbar-btn.primary:hover { filter: brightness(1.1); }

    /* Search */
    .search-wrap {
      position: relative;
    }

    .search-input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px 7px 32px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      outline: none;
      width: 200px;
      transition: all 0.15s;
    }

    .search-input:focus { border-color: var(--accent); width: 260px; }
    .search-input::placeholder { color: var(--text2); }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text2);
      font-size: 13px;
      pointer-events: none;
    }

    /* Main content */
    .main {
      position: relative;
      z-index: 1;
      padding: 32px;
    }

    /* Window section */
    .window-section {
      margin-bottom: 40px;
    }

    .window-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .window-label {
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text2);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 20px;
    }

    .window-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border2) 0%, transparent 100%);
    }

    .window-count {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text2);
    }

    /* Groups grid */
    .groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

    /* Tab Group card */
    .group-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .group-card:hover { border-color: var(--border2); }

    .group-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    .group-header:hover { background: var(--surface2); }

    .group-color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .group-title {
      font-weight: 600;
      font-size: 13px;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .group-tab-count {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text2);
      background: var(--surface3);
      padding: 2px 8px;
      border-radius: 20px;
    }

    .group-toggle {
      font-size: 10px;
      color: var(--text2);
      transition: transform 0.2s;
    }

    .group-card.collapsed .group-toggle { transform: rotate(-90deg); }

    .group-tabs {
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 500px;
      overflow-y: auto;
    }

    .group-card.collapsed .group-tabs { display: none; }

    /* Scrollbar */
    .group-tabs::-webkit-scrollbar { width: 4px; }
    .group-tabs::-webkit-scrollbar-track { background: transparent; }
    .group-tabs::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    /* Ungrouped section */
    .ungrouped-section {
      margin-top: 8px;
    }

    .ungrouped-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      cursor: pointer;
      user-select: none;
      margin-bottom: 8px;
    }

    .ungrouped-label {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .ungrouped-count {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text2);
      background: var(--surface2);
      padding: 2px 8px;
      border-radius: 20px;
    }

    .ungrouped-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .ungrouped-toggle {
      font-size: 10px;
      color: var(--text2);
      transition: transform 0.2s;
    }

    .ungrouped-section.collapsed .ungrouped-toggle { transform: rotate(-90deg); }

    .ungrouped-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 6px;
    }

    .ungrouped-section.collapsed .ungrouped-grid { display: none; }

    /* Tab row */
    .tab-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.12s;
      text-decoration: none;
      color: var(--text);
      position: relative;
      overflow: hidden;
      min-height: 50px;
    }

    .tab-row:hover {
      background: var(--surface2);
    }

    .tab-row:hover .tab-goto { opacity: 1; }

    .tab-favicon {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      flex-shrink: 0;
      object-fit: contain;
    }

    .tab-favicon-placeholder {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      background: var(--surface3);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: var(--text2);
    }

    .tab-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .tab-title {
      font-size: 12.5px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1.4;
    }

    .tab-url {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1.4;
    }

    .tab-goto {
      opacity: 0;
      transition: opacity 0.15s;
      font-size: 11px;
      color: var(--accent);
      flex-shrink: 0;
      padding: 2px 6px;
      background: rgba(79,126,255,0.1);
      border-radius: 4px;
      font-family: var(--mono);
    }

    .tab-pinned {
      font-size: 9px;
      flex-shrink: 0;
      opacity: 0.6;
    }

    /* Loading */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 50vh;
      gap: 16px;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text2);
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 40px;
      color: var(--text2);
      font-family: var(--mono);
      font-size: 13px;
    }

    /* Color map for Chrome group colors */
    .color-blue { background: var(--group-blue); }
    .color-red { background: var(--group-red); }
    .color-yellow { background: var(--group-yellow); }
    .color-green { background: var(--group-green); }
    .color-pink { background: var(--group-pink); }
    .color-purple { background: var(--group-purple); }
    .color-cyan { background: var(--group-cyan); }
    .color-orange { background: var(--group-orange); }
    .color-grey, .color-gray { background: var(--group-grey); }

    .border-blue { border-top: 3px solid var(--group-blue); }
    .border-red { border-top: 3px solid var(--group-red); }
    .border-yellow { border-top: 3px solid var(--group-yellow); }
    .border-green { border-top: 3px solid var(--group-green); }
    .border-pink { border-top: 3px solid var(--group-pink); }
    .border-purple { border-top: 3px solid var(--group-purple); }
    .border-cyan { border-top: 3px solid var(--group-cyan); }
    .border-orange { border-top: 3px solid var(--group-orange); }
    .border-grey, .border-gray { border-top: 3px solid var(--group-grey); }

    /* Notification toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 10px;
      padding: 12px 18px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text);
      z-index: 1000;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
      max-width: 300px;
    }

    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.ok { border-left: 3px solid var(--green); }
    .toast.err { border-left: 3px solid var(--red); }
    .toast.info { border-left: 3px solid var(--accent); }

    /* Highlight on search match */
    .tab-row.hidden { display: none; }

    .tab-row.highlight { background: rgba(79,126,255,0.08); }

    /* Fade-in animation */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .group-card, .tab-row {
      animation: fadeUp 0.25s ease both;
    }

    /* ── Theme picker ───────────────────────────────────────────────── */
    .theme-picker {
      position: relative;
    }

    .theme-trigger {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border2);
      background: var(--surface2);
      color: var(--text2);
      font-family: var(--title);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
      white-space: nowrap;
    }

    .theme-trigger:hover { background: var(--surface3); color: var(--text); }

    .theme-trigger .theme-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      flex-shrink: 0;
    }

    .theme-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 240px;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 12px;
      padding: 10px;
      z-index: 200;
      box-shadow: 0 16px 48px rgba(0,0,0,0.4);
      display: none;
      flex-direction: column;
      gap: 4px;
    }

    .theme-dropdown.open { display: flex; }

    .theme-section-label {
      font-family: var(--mono);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text2);
      padding: 4px 8px 2px;
      margin-top: 4px;
    }

    .theme-section-label:first-child { margin-top: 0; }

    .theme-swatch {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.12s;
      border: 1px solid transparent;
    }

    .theme-swatch:hover { background: var(--surface2); }

    .theme-swatch.active {
      background: var(--surface2);
      border-color: var(--accent);
    }

    .swatch-preview {
      display: flex;
      gap: 3px;
      flex-shrink: 0;
    }

    .swatch-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .swatch-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      flex: 1;
    }

    .swatch-emoji {
      font-size: 13px;
      flex-shrink: 0;
    }

    .swatch-active-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      opacity: 0;
    }

    .theme-swatch.active .swatch-active-dot { opacity: 1; }

    .theme-auto-badge {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--accent);
      background: rgba(79,126,255,0.12);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(79,126,255,0.2);
      margin-left: auto;
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">
    <span class="logo-hex">⬡</span>
    <span class="logo-name">TabVault</span>
  </div>
  <div class="topbar-sep"></div>
  <div class="topbar-stats" id="topbarStats">
    <span class="topbar-stat">Loading...</span>
  </div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input class="search-input" id="searchInput" placeholder="Search tabs…" />
  </div>
  <div class="topbar-actions">
    <button class="topbar-btn" id="btnCollapseAll">Collapse All</button>
    <button class="topbar-btn" id="btnExpandAll">Expand All</button>
    <div class="theme-picker" id="themePicker">
      <div class="theme-trigger" id="themeMenuTrigger">
        <div class="theme-dot"></div>
        <span id="themeLabel">Themes</span>
        <span style="font-size:9px;opacity:0.6">▼</span>
      </div>
      <div class="theme-dropdown" id="themeDropdown"></div>
    </div>
    <button class="topbar-btn primary" id="btnRefresh">↺ Refresh</button>
  </div>
</div>

<div class="main" id="mainContent">
  <div class="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading your tabs...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="themes.js"></script>
<script src="tabview.js"></script>
</body>
</html>
